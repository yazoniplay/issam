<!DOCTYPE html>
<html>
<head><title>ISSAW Admin Login</title><link rel="stylesheet" href="style.css"></head>
<body class="admin-page">
<div class="card login-card">
<h1>Admin Login</h1>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="error"></p>
</div>
<script>
function login(){
 if(user.value==='issawadmin' && pass.value==='change-this-password'){
 localStorage.admin='true';location.href='admin.html';
 } else error.innerText='Invalid login';
}
</script>
</body></html>

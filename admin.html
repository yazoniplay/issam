<!DOCTYPE html>
<html>
<head><title>IssamExprec Admin</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="logo">IssamExprec ADMIN</div></header>
<section class="dashboard">
<div class="card">
<h2>Add Product</h2>
<input id="name" placeholder="Product name">
<input id="price" placeholder="Price">
<input id="brand" placeholder="Brand">
<input id="image" type="file" accept="image/*">
<button onclick="addProduct()">Upload Product</button>
</div>
<div class="card"><h2>Products</h2><div id="list"></div></div>
</section>
<script type="module">
import { supabase } from './supabase.js';
if(localStorage.admin!=='true') location.href='admin-login.html';

async function addProduct(){
 const file=image.files[0];
 let imageUrl='';
 if(file){
  const path=Date.now()+'-'+file.name;
  await supabase.storage.from('product-images').upload(path,file);
  imageUrl=supabase.storage.from('product-images').getPublicUrl(path).data.publicUrl;
 }
 await supabase.from('products').insert({name:name.value,price:Number(price.value),brand:brand.value,image_url:imageUrl});
 render();
}
window.addProduct=addProduct;

async function render(){
 const {data}=await supabase.from('products').select('*');
 list.innerHTML=(data||[]).map(p=>`<div class='card'><img src='${p.image_url}' width='100'><h3>${p.name}</h3><p>${p.brand} - ${p.price}</p></div>`).join('');
}
render();
</script>
</body></html>

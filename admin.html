<!DOCTYPE html>
<html>
<head>
<title>IssamExprec Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="logo">IssamExprec ADMIN</div></header>

<section class="dashboard">
<div class="card">
<h2>Add Product</h2>
<input id="name" placeholder="Product name">
<input id="price" placeholder="Price">
<input id="brand" placeholder="Brand">
<input id="description" placeholder="Description">
<input id="category" placeholder="Category">
<input id="image" type="file" accept="image/*">
<button onclick="addProduct()">Upload Product</button>
</div>

<div class="card">
<h2>Products</h2>
<div id="list"></div>
</div>
</section>

<script type="module">
import { supabase } from './supabase.js';

if(localStorage.admin!=='true') location.href='admin-login.html';

async function uploadImage(file){
 if(!file) return '';
 const path=Date.now()+'-'+file.name;
 const {error}=await supabase.storage.from('product-images').upload(path,file);
 if(error) throw error;
 return supabase.storage.from('product-images').getPublicUrl(path).data.publicUrl;
}

async function addProduct(){
 const imageUrl=await uploadImage(image.files[0]);
 await supabase.from('products').insert({
  name:name.value,
  price:Number(price.value),
  brand:brand.value,
  description:description.value,
  category:category.value,
  image_url:imageUrl
 });
 render();
}
window.addProduct=addProduct;

async function removeProduct(id){
 await supabase.from('products').delete().eq('id',id);
 render();
}
window.removeProduct=removeProduct;

async function editProduct(id){
 const newPrice=prompt('New price:');
 if(newPrice){
  await supabase.from('products').update({price:Number(newPrice)}).eq('id',id);
  render();
 }
}
window.editProduct=editProduct;

async function render(){
 const {data}=await supabase.from('products').select('*').order('created_at',{ascending:false});
 list.innerHTML=(data||[]).map(p=>`
 <div class="card">
 <img src="${p.image_url||''}" width="100">
 <h3>${p.name}</h3>
 <p>${p.brand} - ${p.price} SEK</p>
 <button onclick="editProduct('${p.id}')">Edit Price</button>
 <button onclick="removeProduct('${p.id}')">Delete</button>
 </div>`).join('');
}

render();
</script>
</body>
</html>

<!DOCTYPE html><html><head><title>ISSAW Admin</title><link rel="stylesheet" href="style.css"></head><body><section class="hero"><h1>Admin Panel</h1></section><section class="products"><div class="card"><h2>Add Product</h2><input id="name" placeholder="Product name"><input id="price" placeholder="Price"><input id="brand" placeholder="Brand"><button onclick="addProduct()">Add Product</button></div></section><script>function addProduct(){let p=JSON.parse(localStorage.products||'[]');p.push({name:name.value,price:price.value,brand:brand.value});localStorage.products=JSON.stringify(p);alert('Product added')}</script></body></html>

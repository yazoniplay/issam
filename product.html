<!DOCTYPE html>
<html>
<head>
<title>IssamExprec | Product</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="navbar">
<a class="logo" href="index.html">IssamExprec</a>
<nav><a href="shop.html">Shop</a><a href="cart.html">Cart <span id="cart-count">0</span></a></nav>
</header>

<main class="product-page">
<section id="product" class="product-detail card"></section>
</main>

<script src="assets/js/store.js"></script>
<script>
const params=new URLSearchParams(location.search);
const id=params.get('id');
const product=getProducts().find(p=>String(p.id)===String(id));
const area=document.getElementById('product');
if(product){
 area.innerHTML=`<img class="product-image" src="${product.image_url||product.image||''}"><div><p>${product.brand||''}</p><h1>${product.name}</h1><h2>${product.price} SEK</h2><p>${product.description||'Premium sportswear product.'}</p><button class="btn" onclick="addToCart('${product.id}')">Add to cart</button></div>`;
}else{area.innerHTML='<h1>Product not found</h1>'}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>IssamExprec | Shop</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="navbar">
<a class="logo" href="index.html">IssamExprec</a>
<nav>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="cart.html">Cart <span id="cart-count">0</span></a>
</nav>
</header>

<main class="shop-page">
<section class="shop-hero fade">
<h1>Sportswear Collection</h1>
<p>Premium Under Armour and Umbro products.</p>
<input id="search" placeholder="Search products...">
</section>

<section class="collection">
<h2>Latest Products</h2>
<div class="products" id="products"></div>
</section>
</main>

<script src="assets/js/store.js"></script>
<script>
const search=document.getElementById('search');
if(search){
 search.addEventListener('input',e=>{
  const value=e.target.value.toLowerCase();
  document.querySelectorAll('.product').forEach(card=>{
   card.style.display=card.textContent.toLowerCase().includes(value)?'':'none';
  });
 });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>IssamExprec | Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<a class="logo" href="index.html">IssamExprec</a>
<nav>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="cart.html">Cart</a>
</nav>
</header>

<main class="shop-page">
<section class="shop-hero">
<h1>Sportswear Collection</h1>
<p>Premium Under Armour and Umbro products.</p>
<input id="search" placeholder="Search products...">
</section>

<section class="collection">
<h2 class="title">Latest Products</h2>
<div class="products" id="products"></div>
</section>
</main>

<script src="products.js"></script>
<script>
const search=document.getElementById('search');
if(search){
 search.addEventListener('input',()=>{
  const value=search.value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
   card.style.display=card.textContent.toLowerCase().includes(value)?'':'none';
  });
 });
}
</script>
</body>
</html>

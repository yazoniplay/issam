<!DOCTYPE html>
<html>
<head>
<title>IssamExprec Orders</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<div class="logo">IssamExprec ORDER MANAGER</div>
<button onclick="logout()">Logout</button>
</header>

<section class="dashboard">
<div id="orders"></div>
</section>

<script type="module">
import supabase from './supabase.js';

const ordersBox=document.getElementById('orders');

async function protect(){
 const {data}=await supabase.auth.getSession();
 if(!data.session) location.href='admin-login.html';
}

await protect();

async function logout(){
 await supabase.auth.signOut();
 location.href='admin-login.html';
}
window.logout=logout;

async function updateStatus(id,status){
 await supabase.from('orders').update({status}).eq('id',id);
 loadOrders();
}
window.updateStatus=updateStatus;

async function deleteOrder(id){
 await supabase.from('orders').delete().eq('id',id);
 loadOrders();
}
window.deleteOrder=deleteOrder;

async function loadOrders(){
 const {data,error}=await supabase
  .from('orders')
  .select('*, order_items(*)')
  .order('created_at',{ascending:false});

 if(error){
  ordersBox.innerHTML='<h2>Error loading orders</h2>';
  return;
 }

 ordersBox.innerHTML=(data||[]).map(o=>`
 <div class="card">
  <h2>Order #${o.id.slice(0,8)}</h2>
  <p><b>Customer:</b> ${o.customer_name||'Unknown'}</p>
  <p><b>Email:</b> ${o.email||'-'}</p>
  <p><b>Phone:</b> ${o.phone||'-'}</p>
  <p><b>Address:</b> ${o.address||'-'}</p>
  <p><b>Total:</b> ${o.total} SEK</p>
  <p>Status: <b>${o.status}</b></p>
  <button onclick="updateStatus('${o.id}','Processing')">Processing</button>
  <button onclick="updateStatus('${o.id}','Shipped')">Shipped</button>
  <button onclick="updateStatus('${o.id}','Delivered')">Delivered</button>
  <button onclick="deleteOrder('${o.id}')">Delete</button>
 </div>`).join('') || '<h2>No orders yet</h2>';
}

loadOrders();
</script>
</body>
</html>
